name: Feature request
description: Suggest a change in behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: "What do you want to do that is not possible now?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "How could it work?"
  - type: textarea
    id: languages
    attributes:
      label: "Languages affected"
      description: "Text languages and interface languages, if relevant."
